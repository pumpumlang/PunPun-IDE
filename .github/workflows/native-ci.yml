name: Native CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from this run, tagged v<VERSION>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libarchive-dev \
            qt6-base-dev qt6-svg-dev qt6-declarative-dev libgl1-mesa-dev \
            libxkbcommon-x11-0 libfuse2t64 desktop-file-utils
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        # The editor tests need a display; offscreen keeps CI headless.
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build AppImage
        run: ./scripts/build_appimage.sh
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get install -y xvfb
          ./dist/*.AppImage --appimage-extract > /dev/null
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            timeout 25 ./squashfs-root/AppRun --version || true
          test -s dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: PunPun-IDE-linux-x86_64
          path: dist/*.AppImage

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          # No `modules:` line. Svg and Declarative are Qt Essentials and ship
          # in the base install; aqt only treats add-ons (qtwebengine, qtpdf)
          # as modules, so naming them here failed the job outright with
          # "The packages ['qtdeclarative', 'qtsvg'] were not found".
          cache: true
      - name: Install libarchive
        shell: pwsh
        run: vcpkg install libarchive:x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage portable app
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          windeployqt --release --no-translations stage/bin/punpun-ide.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" stage/bin/ -ErrorAction SilentlyContinue
          $version = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage/* -DestinationPath "dist/PunPun-IDE-v$version-windows-x64.zip" -Force
      - name: Build installer
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G NSIS -B dist-installer
          Copy-Item dist-installer/*.exe dist/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: PunPun-IDE-windows-x64
          path: dist/*

  release:
    # Publishes for a pushed v* tag, or for a manual run asking for one, and
    # only when both platforms pass. The manual path exists because pushing a
    # tag is not always available to whoever is cutting the release.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.zip' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          # A release with no binaries is worse than no release: it looks
          # published but installs nothing.
          test -n "$(ls -A release)" || { echo "no build artifacts to publish"; exit 1; }
          ( cd release && sha256sum * > SHA256SUMS )
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release/*
          generate_release_notes: true
